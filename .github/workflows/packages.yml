name: Package installers
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux packaging tool
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y fakeroot
      - name: Test and package
        run: ./gradlew test jpackage
      - uses: actions/upload-artifact@v4
        with:
          name: intonation-trainer-${{ runner.os }}
          path: |
            build/jpackage/*.deb
            build/jpackage/*.exe
            build/jpackage/*.dmg
          if-no-files-found: error
