plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.1.5'
}

version = '1.2.1'

repositories { mavenCentral() }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

javafx {
    version = '21.0.9'
    modules = ['javafx.controls']
}

application {
    mainModule = 'ru.diplom.intonation'
    mainClass = 'ru.diplom.intonation.IntonationApp'
}

jlink {
    launcher { name = 'intonation-trainer' }
    jpackage {
        imageName = 'Intonation Trainer'
        installerName = 'IntonationTrainer'
        appVersion = project.version.toString()
        def osName = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT)
        installerType = osName.contains('linux') ? 'deb' : (osName.contains('mac') ? 'dmg' : 'exe')
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('processResources') {
    filesMatching('**/version.properties') {
        expand(appVersion: project.version.toString())
    }
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.register('uiPreview', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.diplom.intonation.UiPreview'
    args project.findProperty('previewPath') ?: '/tmp/intonation-preview.png'
    if (project.hasProperty('previewTab')) args project.property('previewTab')
    if (project.hasProperty('previewWidth') && project.hasProperty('previewHeight')) {
        if (!project.hasProperty('previewTab')) args '0'
        args project.property('previewWidth'), project.property('previewHeight')
    }
}

tasks.register('pitchQualityReport', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.diplom.intonation.audio.PitchQualityReport'
    args layout.buildDirectory.file('reports/pitch-quality.md').get().asFile.absolutePath
}

// Build the current platform's installer only after the tests pass.
tasks.named('jpackage') { mustRunAfter tasks.named('test') }
tasks.register('localRelease') { dependsOn tasks.named('test'), tasks.named('jpackage') }
